runtime:
  pollMs: 2500
  paper: true

risk:
  # Nota: sem PnL realizado no CLOB, usamos caps por NOTIONAL como segurança.
  maxDailyNotionalUsdc: 25
  maxOpenNotionalUsdcTotal: 30
  maxOpenNotionalUsdcPerMarket: 10
  maxOrderNotionalUsdc: 3
  maxOpenOrders: 12

  # Circuit breaker
  maxConsecutiveFailures: 3
  maxDataLatencyMs: 4000
  cooldownAfterHaltMs: 300000

marketFilter:
  minTopLevels: 3
  minTopDepthShares: 25

  # For MM you need *some* spread to earn. For arb you may allow tighter.
  maxSpreadAbs: 0.03
  minSpreadAbs: 0.002

  minTradesLookbackSec: 3600
  minTradesCount: 5

  # Only enforced if you supply a closeTimeMs in the market spec (optional)
  minTimeToCloseMs: 600000

metrics:
  depthLevels: 10
  volatilityWindow: 60
  micropriceLevels: 1

strategies:
  arbitrage:
    enabled: true
    edgeAbs: 0.01
    maxLegNotionalUsdc: 2
    legTimeoutMs: 1500
    hedgeTimeoutMs: 1500

  staleCapture:
    enabled: true

    # Detecção de "movimento brusco"
    jumpAbs: 0.03          # J: salto do mid (abs, 0..1)
    windowSec: 20          # W: janela em segundos para medir o jump
    burstTradesMin: 8      # K: número mínimo de trades em W

    # Confirmação de "liquidez do lado antigo"
    wrongSideMinLevelShares: 50   # nível grande no lado errado
    wrongSideMaxDistanceAbs: 0.02 # quão perto do preço antigo ainda conta

    # Execução
    fairEmaAlpha: 0.2
    edgeAbs: 0.01
    maxNotionalUsdc: 2
    orderTtlMs: 8000

    # Saída / risco
    timeStopMs: 60000
    stopLossAbs: 0.03
    takeProfitAbs: 0.02

  marketMaking:
    enabled: true

    spreadMinAbs: 0.003
    spreadTargetAbs: 0.010     # alvo base (antes de vol)
    volMax: 0.020              # se volatility_mid > volMax, desliga MM

    deltaRequoteAbs: 0.004     # se mid mover mais que isso, cancela/substitui
    quoteTtlMs: 8000
    replaceCooldownMs: 1500

    invMaxNotionalUsdc: 5      # inventário máximo (aprox) por token
    invSkewK: 0.03             # skew por USDC de inventário

    quoteNotionalUsdc: 1       # tamanho por lado

markets:
  - id: example_binary_market
    conditionId: "0x...optional"
    outcomes:
      - tokenId: "123" # YES token id
        label: "YES"
      - tokenId: "456" # NO token id
        label: "NO"
    enableArb: true
    enableStaleCapture: true
    enableMarketMaking: false

  - id: example_multi_outcome
    outcomes:
      - tokenId: "111"
        label: "A"
      - tokenId: "222"
        label: "B"
      - tokenId: "333"
        label: "C"
    enableArb: true
    enableStaleCapture: false
    enableMarketMaking: false
