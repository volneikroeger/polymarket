runtime:
  paper: true           # default SAFE: no LIVE
  liveArmed: false      # double opt-in required for LIVE
  dryRun: true          # default SAFE: do not post orders
  telegramEnabled: false

refresh:
  universeRefreshMs: 600000
  monitorPollMs: 1000
  maxMarketsMonitored: 60

filter:
  maxDisplayedSum: 1.02
  maxSpreadAbs: 0.01
  topN: 15

  # Liquidez (USDC notional) dentro dos topN níveis, por perna
  minAskNotionalTopNUsdc: 150
  minBidNotionalTopNUsdc: 150

  minBestAsk: 0.02
  maxBestAsk: 0.98

  # Trades (se getTrades tiver timestamps) senão usar churn
  minTradesLast5m: 3
  minVolumeLast1hUsdc: 200
  minChurnPerMin: 3

arb:
  # sizing
  legNotionalUsdc: 2

  # buffers e lucro
  feeBufferAbs: 0.003           # por share (0..1)
  slippageBufferAbs: 0.002      # por share
  safetyMarginUsdc: 0.01        # absoluto

  minProfitUsdc: 0.03
  minRoiPct: 0.006              # 0.6%

  # execução marketable via LIMIT: pior preço do walk + execBufferAbs
  execBufferAbs: 0.002

  # polling fino de fills durante execução
  pollIntervalMsExec: 200

  # timeouts curtos
  legFillTimeoutMs: 1200
  leg2TimeoutMs: 1500
  ttlMs: 1500
  revalidateBeforeEachLeg: true

  # partial / unwind
  maxPartialFillPct: 0.25
  maxUnwindLossUsdc: 0.20
  maxUnwindLossPct: 0.025

  # concurrency
  maxConcurrentOpps: 1

risk:
  statePath: /var/lib/polymarket-arb-scanner/state.json

  maxDailyNotionalUsdc: 25
  maxDailyLossUsdc: 2

  maxOpenExposureUsdc: 10
  maxExposurePerMarketUsdc: 4
  maxOneLegExposureUsdc: 3

  maxOpenOrders: 10

  maxOrdersPerMinute: 30
  maxCancelsPerMinute: 60

  maxConsecutiveFailures: 5
  maxConsecutiveUnwinds: 3
  cooldownPerMarketMs: 600000

  httpErrorsHaltThreshold: 5
  haltDurationMs: 600000

  latencyMaxMs: 1500
  latencyMaxBreachesToHalt: 5

  feedStaleMs: 5000

  cooldownAfterHaltMs: 300000
