runtime:
  paper: true
  liveArmed: false
  dryRun: true
  telegramEnabled: false

refresh:
  universeRefreshMs: 600000
  monitorPollMs: 3000
  maxMarketsMonitored: 40

filter:
  # seleção automática (heurística barata por preço exibido)
  maxDisplayedSum: 1.02

  # hard guards por perna (top-of-book)
  maxSpreadAbs: 0.01
  topN: 15

  # Liquidez por NOTIONAL (USDC) nos topN níveis
  minAskNotionalTopNUsdc: 150
  minBidNotionalTopNUsdc: 150

  minBestAsk: 0.02
  maxBestAsk: 0.98

arb:
  legNotionalUsdc: 2

  feeBufferAbs: 0.003
  slippageBufferAbs: 0.002
  safetyMarginUsdc: 0.01

  minProfitUsdc: 0.03
  minRoiPct: 0.006

  execBufferAbs: 0.002
  pollIntervalMsExec: 200

  ttlMs: 1500
  revalidateBeforeEachLeg: true

  legFillTimeoutMs: 1200
  leg2TimeoutMs: 1500
  oneLegMaxTimeMs: 2000

  maxPartialFillPct: 0.25
  maxUnwindLossUsdc: 0.20
  maxUnwindLossPct: 0.025

  maxConcurrentOpps: 1

risk:
  statePath: /var/lib/polymarket-arb-scanner/state.json

  maxDailyNotionalUsdc: 25
  maxDailyLossUsdc: 2

  maxOpenExposureUsdc: 10
  maxExposurePerMarketUsdc: 4
  maxOneLegExposureUsdc: 3

  maxOpenOrders: 10

  maxOrdersPerMinute: 30
  maxCancelsPerMinute: 60

  maxConsecutiveFailures: 5
  maxConsecutiveUnwinds: 3
  cooldownPerMarketMs: 600000

  httpErrorsHaltThreshold: 5
  haltDurationMs: 600000

  latencyMaxMs: 1500
  latencyMaxBreachesToHalt: 5

  feedStaleMs: 5000

  cooldownAfterHaltMs: 300000
