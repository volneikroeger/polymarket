runtime:
  paper: true

refresh:
  universeRefreshMs: 600000      # 10 min
  monitorPollMs: 4000            # scan loop cadence
  maxMarketsMonitored: 30        # monitor top-N candidates

filter:
  # Heurística barata: pelo preço exibido (simplified markets), só pega mercados onde
  # (price_yes + price_no) é <= esse valor (quanto menor, mais "suspeito")
  maxDisplayedSum: 0.995

  # Hard guards por perna (book)
  maxSpreadAbs: 0.05
  topN: 10
  minAskDepthTopN: 50

  minBestAsk: 0.02
  maxBestAsk: 0.98

arb:
  edgeAbs: 0.005                 # dispara se sum(bestAsk_yes + bestAsk_no) < 0.995
  legNotionalUsdc: 2
  maxConcurrentOpps: 1
  orderTtlMs: 8000

risk:
  maxDailyNotionalUsdc: 25
  maxConsecutiveFailures: 5
  cooldownAfterHaltMs: 300000
