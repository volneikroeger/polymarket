# Configurações padrão para o bot gopfan2, com foco em segurança e spreads aceitáveis.
# Baseado nas configurações gerais e exemplos.

traders:
  - "0xf2f6af4f27ec2dcf4072095ab804016e14cd5817" # gopfan2 public address

copy:
  fixedUsdcPerTrade: 2 # Valor conservador para trades.
  marketable: false

risk:
  maxUsdcPerTrade: 10 # Limite por trade, conservador.
  maxOpenUsdcPerMarket: 20 # Limite de exposição por mercado. MAIOR AGORA.
  maxDailyLossUsdc: 5 # Perda máxima diária.
  maxActiveMarkets: 5 # Limite de mercados ativos simultaneamente.
  maxPriceMove: 0.01 # Evita mercados voláteis demais.
  # allowMarkets: [] # Para gopfan2, pode ser útil especificar mercados se não forem todos.
  # denyMarkets: []

runtime:
  paper: true # Começar em paper trading.
  pollIntervalMs: 2000 # Intervalo de polling.
